name: Manual public release audit

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact commit or tag to audit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: public-release-audit
  cancel-in-progress: false

jobs:
  audit:
    environment: public-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the proposed release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_ref }}

      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install locked dependencies for browser setup
        run: pnpm install --frozen-lockfile

      - name: Install isolated browser and system dependencies
        run: pnpm --filter @replicantos/e2e exec playwright install --with-deps chromium

      - name: Materialize private release policy outside the repository
        shell: bash
        env:
          PRIVATE_TERMS: ${{ secrets.REPLICANTOS_PRIVATE_TERMS }}
          APPROVALS_JSON: ${{ secrets.REPLICANTOS_RELEASE_APPROVALS_JSON }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$PRIVATE_TERMS"
          test -n "$APPROVALS_JSON"
          printf '%s\n' "$PRIVATE_TERMS" > "$RUNNER_TEMP/replicantos-private-terms.txt"
          printf '%s\n' "$APPROVALS_JSON" > "$RUNNER_TEMP/replicantos-release-approvals.json"
          {
            echo "REPLICANTOS_PRIVATE_TERMS_FILE=$RUNNER_TEMP/replicantos-private-terms.txt"
            echo "REPLICANTOS_RELEASE_APPROVALS_FILE=$RUNNER_TEMP/replicantos-release-approvals.json"
            echo "REPLICANTOS_RELEASE_OUTPUT_DIR=$RUNNER_TEMP/replicantos-release-audit"
          } >> "$GITHUB_ENV"

      - name: Verify committed archive and produce release evidence
        env:
          REPLICANTOS_ALLOW_RELEASE_VERIFY: "1"
        run: pnpm release:verify

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-audit-${{ github.sha }}
          path: ${{ runner.temp }}/replicantos-release-audit
          if-no-files-found: error
          retention-days: 30

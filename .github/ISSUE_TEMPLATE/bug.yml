name: Bug report
description: Report a reproducible ReplicantOS defect without private data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private prompts, customer data, or host paths.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest synthetic sequence that reproduces the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ReplicantOS version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Sanitized environment
      description: OS, Node.js version, browser, and harness version only.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, personal data, private prompts, and identifying host paths.
          required: true

name: Feature request
description: Propose a focused improvement to the self-hosted public edition.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operator or collaborator problem should this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the behavior, not only a proposed implementation.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Security and self-hosting considerations
      description: Note permission, filesystem, credential, or deployment implications.
